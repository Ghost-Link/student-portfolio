<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">StudyFlow academic planner</title>
  <desc id="desc">A dark task planner with completed and active study tasks, due-date chips and a 67 percent progress ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b100a"/>
      <stop offset="0.55" stop-color="#070907"/>
      <stop offset="1" stop-color="#0d1309"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1a2413" stroke-width="1"/>
    </pattern>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4f82a"/>
      <stop offset="1" stop-color="#d7ff64"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
