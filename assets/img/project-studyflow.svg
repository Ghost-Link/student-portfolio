    <rect x="360" y="604" width="26" height="26" rx="6" fill="#0b100a" stroke="#314c13" stroke-width="2"/>
    <text x="404" y="614" font-size="15" font-weight="600" fill="#f5f7f0">Document SentinelScan findings</text>
