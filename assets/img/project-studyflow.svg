    <rect x="360" y="516" width="26" height="26" rx="6" fill="#0b100a" stroke="#314c13" stroke-width="2"/>
    <text x="404" y="526" font-size="15" font-weight="600" fill="#f5f7f0">Submit threat-modelling report</text>
