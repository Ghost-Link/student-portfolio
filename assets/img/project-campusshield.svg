<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">CampusShield security awareness dashboard</title>
  <desc id="desc">A dark analytics dashboard with click-rate statistics, a bar chart and department risk ratings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b100a"/>
      <stop offset="0.55" stop-color="#070907"/>
      <stop offset="1" stop-color="#0d1309"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1a2413" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#314c13"/>
      <stop offset="1" stop-color="#c4f82a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1040" cy="670" r="230" fill="#c4f82a" opacity="0.05"/>

  <text x="70" y="82" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" font-weight="600" letter-spacing="3" fill="#c4f82a">// SECURITY AWARENESS</text>
  <text x="70" y="126" font-family="'Space Grotesk',Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#f5f7f0">CAMPUSSHIELD</text>
  <text x="1130" y="126" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8b95a5">PHISHING SIMULATION · WEEK 6</text>

  <rect x="70" y="164" width="1060" height="510" rx="22" fill="#050705" stroke="#314c13" stroke-width="1.5"/>
  <rect x="70" y="164" width="210" height="510" rx="22" fill="#0b100a"/>
  <rect x="260" y="164" width="20" height="510" fill="#050705"/>
  <line x1="260" y1="164" x2="260" y2="674" stroke="#24301a"/>

  <circle cx="102" cy="202" r="14" fill="#c4f82a"/>
  <path d="M102 193l9 4v7c0 6-4 10-9 12-5-2-9-6-9-12v-7z" fill="#0a0d09"/>
  <text x="126" y="208" font-family="'Space Grotesk',Arial,sans-serif" font-size="16" font-weight="700" fill="#f5f7f0">CampusShield</text>
  <text x="94" y="256" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" letter-spacing="2" fill="#314c13">WORKSPACE</text>
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="13">
    <rect x="86" y="270" width="178" height="36" rx="8" fill="#141b10"/>
    <text x="102" y="293" fill="#c4f82a">▣  Overview</text>
    <text x="102" y="333" fill="#8b95a5">◎  Campaigns</text>
    <text x="102" y="369" fill="#8b95a5">◇  Departments</text>
    <text x="102" y="405" fill="#8b95a5">△  Reports</text>
    <text x="102" y="441" fill="#8b95a5">⚙  Settings</text>
  </g>
  <rect x="86" y="596" width="178" height="54" rx="10" fill="#0f150c" stroke="#24301a"/>
  <text x="100" y="618" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">NEXT SIMULATION</text>
  <text x="100" y="636" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#c4f82a">18 MAR · 09:00</text>

  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="12">
    <text x="294" y="212" fill="#8b95a5">SECURITY POSTURE</text>
    <text x="1094" y="212" text-anchor="end" fill="#c4f82a">● SYNCED 2 MIN AGO</text>
  </g>
  <text x="294" y="250" font-family="'Space Grotesk',Arial,sans-serif" font-size="27" font-weight="700" fill="#f5f7f0">Awareness overview</text>

  <g font-family="'JetBrains Mono','Courier New',monospace">
    <rect x="294" y="278" width="240" height="102" rx="14" fill="#0b100a" stroke="#24301a"/>
    <text x="316" y="306" font-size="10" letter-spacing="2" fill="#8b95a5">CLICK RATE</text>
    <text x="316" y="348" font-size="34" font-weight="700" fill="#f5f7f0">8.4%</text>
    <text x="316" y="368" font-size="11" fill="#c4f82a">↓ 3.1% vs week 5</text>

    <rect x="554" y="278" width="240" height="102" rx="14" fill="#0b100a" stroke="#24301a"/>
    <text x="576" y="306" font-size="10" letter-spacing="2" fill="#8b95a5">REPORTS FILED</text>
    <text x="576" y="348" font-size="34" font-weight="700" fill="#f5f7f0">126</text>
    <text x="576" y="368" font-size="11" fill="#c4f82a">↑ 24 this week</text>

    <rect x="814" y="278" width="280" height="102" rx="14" fill="#0b100a" stroke="#24301a"/>
    <text x="836" y="306" font-size="10" letter-spacing="2" fill="#8b95a5">RISK SCORE</text>
    <text x="836" y="348" font-size="34" font-weight="700" fill="#f5f7f0">41<tspan font-size="14" fill="#8b95a5"> / 100</tspan></text>
    <rect x="836" y="358" width="230" height="7" rx="4" fill="#141b10"/>
    <rect x="836" y="358" width="94" height="7" rx="4" fill="#c4f82a"/>
  </g>

  <rect x="294" y="406" width="500" height="232" rx="14" fill="#0b100a" stroke="#24301a"/>
  <text x="318" y="438" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#8b95a5">CLICK RATE BY WEEK</text>
  <g>
    <line x1="330" y1="600" x2="766" y2="600" stroke="#24301a"/>
    <rect x="342" y="540" width="34" height="60" rx="6" fill="url(#bar)" opacity="0.55"/>
    <rect x="398" y="512" width="34" height="88" rx="6" fill="url(#bar)" opacity="0.7"/>
    <rect x="454" y="470" width="34" height="130" rx="6" fill="url(#bar)" opacity="0.85"/>
    <rect x="510" y="500" width="34" height="100" rx="6" fill="url(#bar)"/>
    <rect x="566" y="452" width="34" height="148" rx="6" fill="url(#bar)" opacity="0.75"/>
    <rect x="622" y="524" width="34" height="76" rx="6" fill="url(#bar)" opacity="0.6"/>
    <rect x="678" y="556" width="34" height="44" rx="6" fill="url(#bar)" opacity="0.45"/>
    <text x="359" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">W1</text>
    <text x="415" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">W2</text>
    <text x="471" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">W3</text>
    <text x="527" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">W4</text>
    <text x="583" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">W5</text>
    <text x="639" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#c4f82a">W6</text>
    <text x="695" y="622" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8b95a5">W7</text>
  </g>

  <rect x="814" y="406" width="280" height="232" rx="14" fill="#0b100a" stroke="#24301a"/>
  <text x="836" y="438" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#8b95a5">DEPARTMENT RISK</text>
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="12">
    <text x="836" y="474" fill="#f5f7f0">Finance</text>
    <text x="1072" y="474" text-anchor="end" fill="#ffcf5c">High</text>
    <rect x="836" y="484" width="236" height="6" rx="3" fill="#141b10"/><rect x="836" y="484" width="196" height="6" rx="3" fill="#ffcf5c"/>
    <text x="836" y="516" fill="#f5f7f0">Registry</text>
    <text x="1072" y="516" text-anchor="end" fill="#c4f82a">Low</text>
    <rect x="836" y="526" width="236" height="6" rx="3" fill="#141b10"/><rect x="836" y="526" width="88" height="6" rx="3" fill="#c4f82a"/>
    <text x="836" y="558" fill="#f5f7f0">ICT</text>
    <text x="1072" y="558" text-anchor="end" fill="#c4f82a">Low</text>
    <rect x="836" y="568" width="236" height="6" rx="3" fill="#141b10"/><rect x="836" y="568" width="62" height="6" rx="3" fill="#c4f82a"/>
    <text x="836" y="600" fill="#f5f7f0">Library</text>
    <text x="1072" y="600" text-anchor="end" fill="#ffcf5c">Medium</text>
    <rect x="836" y="610" width="236" height="6" rx="3" fill="#141b10"/><rect x="836" y="610" width="140" height="6" rx="3" fill="#ffcf5c"/>
  </g>

  <text x="1130" y="700" text-anchor="end" font-family="'Space Grotesk',Arial,sans-serif" font-size="96" font-weight="700" fill="#c4f82a" opacity="0.08">03</text>
</svg>
